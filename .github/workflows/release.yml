name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_target: x86_64-linux
            zig_target: x86_64-linux-gnu
            rust_target: x86_64-unknown-linux-gnu
          - os: windows-latest
            artifact_target: x86_64-windows-msvc
            zig_target: x86_64-windows-gnu
            rust_target: x86_64-pc-windows-msvc
          - os: macos-latest
            artifact_target: aarch64-macos
            zig_target: aarch64-macos
            rust_target: aarch64-apple-darwin
          - os: macos-15-intel
            artifact_target: x86_64-macos
            zig_target: x86_64-macos
            rust_target: x86_64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: jdx/mise-action@v4

      - name: Configure Xcode
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build Rust
        run: cargo build --release --target=${{ matrix.rust_target }}

      - name: Test Rust
        run: cargo test --all-targets --target=${{ matrix.rust_target }}

      - name: Test Java JNI
        if: runner.os == 'Linux'
        run: |
          mkdir -p target/java-test
          javac -d target/java-test examples/ZMusicPlayer.java tests/java/me/zhenxin/zmusic/JniSmokeTest.java
          java -Djava.library.path=target/${{ matrix.rust_target }}/release -cp target/java-test me.zhenxin.zmusic.JniSmokeTest

      - name: Build Zig regression
        run: zig build -Dtarget=${{ matrix.zig_target }} -Doptimize=ReleaseSmall

      - name: Test Zig regression
        run: zig build test -Dtarget=${{ matrix.zig_target }} -Doptimize=ReleaseSmall

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zmusic-${{ matrix.artifact_target }}
          path: |
            target/${{ matrix.rust_target }}/release/zmusic-player
            target/${{ matrix.rust_target }}/release/zmusic-player.exe
            target/${{ matrix.rust_target }}/release/libzmusic.so
            target/${{ matrix.rust_target }}/release/libzmusic.dylib
            target/${{ matrix.rust_target }}/release/zmusic.dll

  release:
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          for dir in artifacts/zmusic-*; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            if [[ "$name" == *windows* ]]; then
              (cd "$dir" && zip -r "../../${name}-${version}.zip" .)
            else
              chmod +x "$dir/zmusic-player"
              tar czf "${name}-${version}.tar.gz" -C "$dir" .
            fi
          done

      - name: Determine prerelease
        id: prerelease
        run: |
          is_prerelease="false"
          if [[ "${GITHUB_REF_NAME}" =~ -(alpha|beta|rc|pre)\. ]]; then
            is_prerelease="true"
          fi
          echo "is_prerelease=${is_prerelease}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.tar.gz
            *.zip
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
