name: Build

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
          - os: windows-latest
            target: x86_64-windows-gnu
          - os: macos-latest
            target: aarch64-macos
          - os: macos-15
            target: x86_64-macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: jdx/mise-action@v4

      - name: Configure Xcode
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSmall

      - name: Test
        run: zig build test -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSmall

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zmusic-${{ matrix.target }}
          path: |
            zig-out/bin/
            zig-out/lib/

  # macOS universal binary: lipo merge aarch64 + x86_64
  macos-universal:
    needs: build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: zmusic-aarch64-macos
          path: dist/aarch64

      - uses: actions/download-artifact@v8
        with:
          name: zmusic-x86_64-macos
          path: dist/x86_64

      - name: Create universal binary
        run: bash scripts/create-universal-macos.sh

      - name: Upload universal artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zmusic-universal-macos
          path: |
            zig-out/bin/
            zig-out/lib/
